<html lang="ja">

<style>
  :root{
    --pink: #ff8fab;
    --pink-light: #ffe3ec;
    --pink-deep: #e85d8a;
    --cream: #fff8f5;
    --text: #4a3b3f;
    --text-soft: #8a7478;
    --star: #ffb64c;
    --star-off: #e8dfe2;
    --card-bg: #ffffff;
    --shadow: 0 8px 24px rgba(232,93,138,0.12);
  }
  *{box-sizing:border-box;}
  button{
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  body{
    margin:0;
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic","Helvetica Neue",sans-serif;
    background: linear-gradient(180deg, var(--cream) 0%, var(--pink-light) 100%);
    color: var(--text);
    min-height:100vh;
    padding: 24px 16px 64px;
  }
  .wrap{max-width: 720px; margin: 0 auto;}
  header{text-align:center; margin-bottom: 26px;}
  header .badge{
    display:inline-block;
    background: var(--pink);
    color:#fff;
    font-size: 12px;
    font-weight:700;
    padding: 4px 14px;
    border-radius: 999px;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }
  header h1{
    font-size: 24px;
    margin: 6px 0 8px;
    line-height:1.4;
  }
  header p{
    font-size: 13px;
    color: var(--text-soft);
    margin:0;
  }

  .progress{
    display:flex;
    justify-content:center;
    gap:6px;
    margin-bottom: 22px;
  }
  .progress .dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--star-off);
    transition: background .2s ease;
  }
  .progress .dot.active{background: var(--pink);}

  .back-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 14px;
  }
  .back-btn{
    background: var(--card-bg);
    border:none;
    border-radius: 999px;
    padding: 6px 14px;
    font-size:12px;
    font-weight:700;
    color: var(--pink-deep);
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .crumb{
    font-size:12px;
    color: var(--text-soft);
  }

  .step-label{
    font-size:13px;
    font-weight:700;
    color: var(--pink-deep);
    margin: 4px 0 10px 4px;
  }
  .sub-heading{
    font-size:18px;
    font-weight:800;
    margin: 0 0 4px 4px;
  }
  .sub-desc{
    font-size:12px;
    color: var(--text-soft);
    margin: 0 0 16px 4px;
  }

  .grid2{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .grid3{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .pick-btn{
    background: var(--card-bg);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 16px 8px;
    text-align:center;
    font-size: 13px;
    font-weight:700;
    color: var(--text);
    cursor:pointer;
    box-shadow: var(--shadow);
    transition: all .15s ease;
  }
  .pick-btn .emoji{display:block; font-size:22px; margin-bottom:6px;}
  .pick-btn .desc{
    display:block;
    font-size:10.5px;
    font-weight:400;
    color: var(--text-soft);
    margin-top:4px;
    line-height:1.4;
  }
  .pick-btn:hover{transform: translateY(-2px);}

  .tone-btn{
    background: var(--card-bg);
    border: 2px solid transparent;
    border-radius: 14px;
    padding: 12px 6px;
    text-align:center;
    font-size: 12.5px;
    font-weight:700;
    color: var(--text);
    cursor:pointer;
    box-shadow: var(--shadow);
  }
  .tone-btn .emoji{display:block; font-size:18px; margin-bottom:4px;}
  .tone-btn:hover{transform: translateY(-2px);}

    background: linear-gradient(135deg, var(--pink) 0%, var(--pink-deep) 100%);
    color:#fff;
    border-radius: 20px;
    padding: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .recommend-card .label{
    font-size: 12px;
    opacity:0.85;
    font-weight:700;
    margin-bottom: 6px;
  }
  .recommend-card .tool-name{
    font-size: 22px;
    font-weight:800;
    margin-bottom: 6px;
  }
  .recommend-card .reason{
    font-size: 13px;
    line-height:1.6;
    opacity:0.95;
    margin-bottom: 14px;
  }
  .recommend-card .try-link{
    display:inline-block;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.6);
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    padding: 8px 16px;
    border-radius: 999px;
  }

  .table-wrap{
    background: var(--card-bg);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 6px;
    overflow-x: auto;
  }
  table{
    width:100%;
    border-collapse: collapse;
    font-size: 12.5px;
    min-width: 460px;
  }
  th, td{
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid #f3e6ea;
  }
  th{
    color: var(--text-soft);
    font-weight:700;
    font-size: 11.5px;
  }
  td.tool-cell{
    text-align:left;
    font-weight:700;
    white-space:nowrap;
  }
  td.note-cell{
    text-align:left;
    color: var(--text-soft);
    font-size:11.5px;
  }
  tr:last-child td{border-bottom:none;}
  .stars{white-space:nowrap; letter-spacing:1px;}
  .stars .on{color: var(--star);}
  .stars .off{color: var(--star-off);}

  .restart-row{
    text-align:center;
    margin-top: 20px;
  }
  .restart-btn{
    background: var(--card-bg);
    border:none;
    border-radius: 999px;
    padding: 10px 22px;
    font-size:13px;
    font-weight:700;
    color: var(--pink-deep);
    cursor:pointer;
    box-shadow: var(--shadow);
  }

  .note{
    font-size: 11px;
    color: var(--text-soft);
    text-align:center;
    margin-top: 14px;
    line-height:1.6;
  }
  footer{
    text-align:center;
    margin-top: 40px;
    font-size: 11px;
    color: var(--text-soft);
  }
</style>
</head>

          sekaikan: { claudecode:5, codex:3, antigravity:4 },
          business: { claudecode:5, codex:5, antigravity:3 },
          josei:    { claudecode:3, codex:4, antigravity:5 },
        } },
      { id:"code",      emoji:"💻", label:"コード・プログラム相談", task:"code_web" },
    ]
  },
];

/* ---------- 状態管理 ---------- */
const state = { catId:null, subId:null, toneId:null };
const screenEl = document.getElementById('screen');

function setProgress(step){
  document.querySelectorAll('#progress .dot').forEach(d => {
    d.classList.toggle('active', Number(d.dataset.step) <= step);
  });
}

function starHtml(n){
  let out = '<span class="stars">';
  for(let i=1;i<=5;i++){
    out += `<span class="${i<=n ? 'on':'off'}">★</span>`;
  }
  out += '</span>';
  return out;
}

function renderMain(){
  setProgress(1);
  screenEl.innerHTML = `
    <div class="step-label">STEP1 今から作りたいものは?</div>
    <div class="grid2" id="mainGrid"></div>
  `;
  const grid = document.getElementById('mainGrid');
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pick-btn';
    btn.innerHTML = `<span class="emoji">${cat.emoji}</span>${cat.label}<span class="desc">${cat.desc}</span>`;
    btn.addEventListener('click', () => {
      state.catId = cat.id;
      renderSub();
    });
    grid.appendChild(btn);
  });
}

function renderSub(){
  setProgress(1);
  const cat = CATEGORIES.find(c => c.id === state.catId);
  screenEl.innerHTML = `
    <div class="back-row">
      <button class="back-btn" id="backToMain">← もどる</button>
      <span class="crumb">${cat.emoji} ${cat.label}</span>
    </div>
    <div class="sub-heading">${cat.emoji} ${cat.label}</div>
    <div class="sub-desc">何を作りたい?</div>
    <div class="grid2" id="subGrid"></div>
  `;
  document.getElementById('backToMain').addEventListener('click', renderMain);
  const grid = document.getElementById('subGrid');
  cat.subs.forEach(sub => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pick-btn';
    btn.innerHTML = `<span class="emoji">${sub.emoji}</span>${sub.label}`;
    btn.addEventListener('click', () => {
      state.subId = sub.id;
      renderTone();
    });
    grid.appendChild(btn);
  });
}

function renderTone(){
  setProgress(2);
  const cat = CATEGORIES.find(c => c.id === state.catId);
  const sub = cat.subs.find(s => s.id === state.subId);
  screenEl.innerHTML = `
    <div class="back-row">
      <button class="back-btn" id="backToSub">← もどる</button>
      <span class="crumb">${cat.emoji} ${cat.label} / ${sub.emoji} ${sub.label}</span>
    </div>
    <div class="step-label">STEP2 どんな雰囲気にしたい?</div>
    <div class="grid3" id="toneGrid"></div>
  `;
  document.getElementById('backToSub').addEventListener('click', renderSub);
  const grid = document.getElementById('toneGrid');
  TONES.forEach(tone => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tone-btn';
    btn.innerHTML = `<span class="emoji">${tone.emoji}</span>${tone.label}`;
    btn.addEventListener('click', () => {
      state.toneId = tone.id;
      renderResult();
    });
    grid.appendChild(btn);
  });
}

function renderResult(){
  setProgress(3);
  const cat = CATEGORIES.find(c => c.id === state.catId);
  const sub = cat.subs.find(s => s.id === state.subId);
  const tone = TONES.find(t => t.id === state.toneId);
  const bonus = TONE_BONUS[tone.id] || {};
  const profile = TASK_PROFILES[sub.task];
  const starMap = sub.starOverride && sub.starOverride[tone.id];
  const hasExplicitStars = !starMap && profile.every(e => e.stars !== undefined);

  let ranked;
  if (starMap) {
    ranked = profile
      .map(entry => ({ ...entry, stars: starMap[entry.tool] }))
      .sort((a, b) => b.stars - a.stars);
  } else if (hasExplicitStars) {
    ranked = profile
      .map(entry => ({
        ...entry,
        stars: Math.min(5, Math.max(1, entry.stars + (bonus[entry.tool] || 0)))
      }))
      .sort((a, b) => b.stars - a.stars);
  } else {
    ranked = profile
      .map((entry, idx) => ({
        ...entry,
        score: (profile.length - idx) + (bonus[entry.tool] || 0)
      }))
      .sort((a, b) => b.score - a.score)
      .map((entry, idx) => ({ ...entry, stars: Math.max(1, 5 - idx) }));
  }

  const top = ranked[0];
  const topTool = TOOLS[top.tool];

  screenEl.innerHTML = `
    <div class="back-row">
      <button class="back-btn" id="backToTone">← もどる</button>
      <span class="crumb">${cat.emoji} ${cat.label} / ${sub.emoji} ${sub.label} / ${tone.emoji} ${tone.label}</span>
    </div>
    <div class="step-label">STEP3 おすすめAIを比較</div>
    <div class="recommend-card">
      <div class="label">${sub.label} を ${tone.label} に仕上げたいなら</div>
      <div class="tool-name">${topTool.name} ♡</div>
      <div class="reason">${top.note}</div>
      <a class="try-link" href="${topTool.url}" target="_blank" rel="noopener">このAIを試してみる ♡</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th style="text-align:left;">AI</th><th>おすすめ度</th><th style="text-align:left;">得意</th></tr>
        </thead>
        <tbody id="resultBody"></tbody>
      </table>
    </div>
    <div class="note">おすすめ度は「${sub.label}」を「${tone.label}」に仕上げる場合の目安です。<br>各AIの仕様・料金は更新される場合があります。</div>
    <div class="restart-row"><button class="restart-btn" id="restartBtn">はじめからやり直す</button></div>
  `;
  document.getElementById('backToTone').addEventListener('click', renderTone);
  document.getElementById('restartBtn').addEventListener('click', () => {
    state.catId = null; state.subId = null; state.toneId = null;
    renderMain();
  });

  const body = document.getElementById('resultBody');
  ranked.forEach((entry, idx) => {
    const t = TOOLS[entry.tool];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="tool-cell">${t.name}${idx===0 ? ' 🌟':''}</td>
      <td>${starHtml(entry.stars)}</td>
      <td class="note-cell">${entry.note}</td>
    `;
    body.appendChild(tr);
  });
}

renderMain();
</script>
</body>
</html>
